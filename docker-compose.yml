services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: parksight
      POSTGRES_USER: parksight
      POSTGRES_PASSWORD: parksight123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksight -d parksight"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://parksight:parksight123@db:5432/parksight
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev"
    depends_on:
      - api

volumes:
  pgdata:

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  - type: pserv
    name: parksight-db
    plan: free
    databaseName: parksight
    databaseUser: parksight

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  - type: web
    name: parksight-api
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parksight-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://parksight-frontend.onrender.com
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  - type: web
    name: parksight-frontend
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildArgs:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://parksight-api.onrender.com
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://parksight-api.onrender.com
      - key: NODE_ENV
        value: production
